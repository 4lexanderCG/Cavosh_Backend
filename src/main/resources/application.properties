# Nombre de la aplicación
spring.application.name=cavosh-cafe-api
server.port=8080

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cavosh_cafe_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
# "none" para que Spring Boot respete la estructura que creamos manualmente en SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración JWT
jwt.secret=9a7f8e6d5c4b3a210987654321fedcba0123456789abcdef0123456789abcdef
jwt.expiration=86400000
